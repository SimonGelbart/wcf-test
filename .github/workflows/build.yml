name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CoreWcfJwtSoap/CoreWcfJwtSoap.csproj
      - name: Build
        run: dotnet build CoreWcfJwtSoap/CoreWcfJwtSoap.csproj --no-restore --configuration Release
